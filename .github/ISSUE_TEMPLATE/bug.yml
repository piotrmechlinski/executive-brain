name: Something does not work
description: A tool, a command or a rule of the product does not do what the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is the public repository of the product, not your vault. Anyone can read what you write here.
        Never paste anything from your own vault: no names, no notes, no register rows, no file names.
        Show the problem with the example in `examples/Brightwater`, or with invented data.
  - type: checkboxes
    id: clean
    attributes:
      label: Nothing private
      options:
        - label: This issue holds nothing from my own vault or my organisation.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version that `python3 tools/vault.py status` shows, such as 1.0.0.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where you run it
      options:
        - Claude Code on the web or in the Claude app
        - Claude Code on a computer
        - Another agent, through AGENTS.md
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The command or the words you typed, step by step.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: The check on the example
      description: The output of `python3 tools/vault.py check --vault examples/Brightwater`.
      render: text
