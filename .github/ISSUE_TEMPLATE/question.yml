name: A question
description: How to set up or use Executive Brain.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        This is the public repository of the product, not your vault. Anyone can read what you write here.
        Read README.md and SETUP.md first. Never paste anything from your own vault.
  - type: checkboxes
    id: clean
    attributes:
      label: Nothing private
      options:
        - label: This issue holds nothing from my own vault or my organisation.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
